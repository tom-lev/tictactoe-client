<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>איקס עיגול אונליין</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin-top: 50px; }
    #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; margin: 20px auto; width: 310px; }
    .cell { width: 100px; height: 100px; font-size: 2.5rem; background: #fff; border: 2px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .cell:hover { background: #e0e0e0; }
    input, button { font-size: 1rem; padding: 8px 12px; margin: 5px; }
  </style>
</head>
<body>

  <h1>איקס עיגול אונליין</h1>

  <!-- מסך התחברות ראשוני: בחירת שם חדר -->
  <div id="setup">
    <input type="text" id="roomId" placeholder="הכנס שם חדר (למשל: room1)">
    <button onclick="join()">התחבר / צור חדר</button>
  </div>

  <!-- הודעות סטטוס: "ממתין לשחקן", "התור של X" וכו' -->
  <h2 id="status"></h2>

  <!-- לוח המשחק (מוסתר בהתחלה) -->
  <div id="board" style="display: none;"></div>

  <!-- 1. טעינת ספרית Socket.io מהאינטרנט בדפדפן -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  
  <!-- 2. הקוד של הלוגיקה של הלקוח -->
  <script src="app.js"></script>
</body>
</html>
