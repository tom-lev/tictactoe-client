<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איקס עיגול אונליין</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-wrapper {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 850px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      flex: 1;
      min-width: 320px;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-weight: 800;
      font-size: 2.2rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #setup {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    button {
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      border: none;
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }

    #status {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 15px 0;
      min-height: 28px;
      color: #94a3b8;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .cell {
      aspect-ratio: 1;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      font-size: 2.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.25s ease;
    }

    .cell:hover {
      background: #1e293b;
      border-color: rgba(255, 255, 255, 0.2);
      transform: scale(1.03);
    }

    .cell.x {
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cell.o {
      color: #a855f7;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* עיצוב תיבת הצ'אט */
    .chat-container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      flex: 1;
      min-width: 300px;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      height: 480px;
    }

    .chat-container h3 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #f8fafc;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 5px;
      margin-bottom: 15px;
      text-align: right;
    }

    .message {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      max-width: 85%;
      word-wrap: break-word;
    }

    .message.my-msg {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .message.other-msg {
      align-self: flex-end;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- אזור המשחק -->
    <div class="container">
      <h1>איקס עיגול</h1>

      <div id="setup">
        <input type="text" id="roomId" placeholder="שם החדר (למשל: room123)">
        <button onclick="join()">התחברות לחדר</button>
      </div>

      <div id="status"></div>
      <div id="board" style="display: none;"></div>
    </div>

    <!-- אזור הצ'אט הנתמך -->
    <div class="chat-container" id="chat-box" style="display: none;">
      <h3>צ'אט חי 💬</h3>
      <div id="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="msgInput" placeholder="כתוב הודעה..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMsg()">שלח</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
